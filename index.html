<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Birthday Surprise</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Setup Customizer Overlay -->
    <div id="setup-form-overlay" class="setup-overlay">
        <div class="setup-box">
            <h2>🎉 Customize Birthday Surprise</h2>
            
            <div class="input-group">
                <label for="birthday-name">Birthday Person's Name:</label>
                <input type="text" id="birthday-name" placeholder="Enter name (e.g. Adiba)" autocomplete="off" />
            </div>

            <div class="input-group">
                <label for="photo-upload">Select Photos (Pick any number of photos):</label>
                <input type="file" id="photo-upload" accept="image/*" multiple />
                <small id="file-count-label">0 photo(s) selected</small>
            </div>

            <button id="generate-btn" type="button" onclick="startSurprise()">Generate Surprise ✨</button>
        </div>
    </div>

    <!-- 3D Scene Container -->
    <div id="drag-container">
        <div id="spin-container">
            <!-- Dynamic <img> tags injected here by JS -->
            <p id="birthday-heading">Happy <span>Birthday</span> <span id="display-name"></span></p>
            <button class="button" onclick="openNote()"></button>
        </div>
        <div id="ground"></div>
    </div>

    <!-- Birthday Note Modal Popup -->
    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeNote()">&times;</span>
            <h2>✨ A Special Message For You ✨</h2>
            <div id="typewriter-text" class="typewriter"></div>
            <button class="close-card-btn" onclick="closeNote()">Close Note ❤️</button>
        </div>
    </div>

    <div id="music-container"></div>
    <div id="canva">
        <canvas id="canvas"></canvas>
    </div>

    <audio id="myAudio" loop playsinline>
        <source src="setlove.mp3" type="audio/mpeg">
        <source src="setlove.ogg" type="audio/ogg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
